# V3.1's flow-gate minute bars, the extra window: spot one-minute klines for five coins,
# 2020-02 to 2021-05. The grid's F flow gate reads the last 15 completed one-minute bars of
# each coin it trades (V3.1 design, Package C); a coin without them cannot open grid buys.
# BTCUSDT, ETHUSDT and XRPUSDT already have theirs, in full-range-2017-2024.manifest.json
# (2019-01 to 2024-12); these five coins' bars for 2021-06 to 2024-12 are the first fetch's,
# in v3-1-minute-bars-2021-2024.manifest.json. This window fills in the months before it, so
# that a reported-only V3.1 test window from 2020-03 can cover the eight coins that had
# futures then (BTC, ETH, XRP, ADA, BNB, LINK, LTC, TRX).
#
# The owner approved this fetch on 2026-10-12 (recorded in docs/V3_1_SOURCE_INVENTORY.md on
# PR #269). Bob runs it from docs/tasks/2026-10-12-bob-v3-1-minute-bars-2020-fetch.md, with
# scripts/fetch_minute_bars.py.
#
# Scope: these five symbols, interval 1m, every month from 2020-02 to 2021-05 inclusive,
# 16 months each, 80 archives in all. Nothing at or after 2025-01 is in scope: the reserved
# window stays untouched (spec v1 section 7). The loader refuses a month after 2024-12, as
# the downloader and the manifest checks do, and the fetch refuses every path outside this
# plan. No hourly, daily or funding archive, no exchange filters, no other host.
#
# Listings: the committed hourly inventory (config/datasets/v3-20261009/inventory.manifest.json)
# holds an eligible spot archive for each of the five in each of these 16 months, so no
# minute archive is expected to be missing. If one is, the fetch records it as missing and
# reports it as a problem; nothing is invented to fill it.
#
# This is not a backtest dataset spec: it has no traded pairs, basket or pricing, and
# lives in its own folder so that the backtest CLI and workflow never mistake it for one.
name = "v3-1-minute-bars-2020-2021"
purpose = "V3.1 extra reported-only window, flow gate"
interval = "1m"
symbols = [
  "ADAUSDT", "BNBUSDT", "LINKUSDT", "LTCUSDT", "TRXUSDT",
]
start = "2020-02"
end = "2021-05"
