# Recovery and bull window: 2023 recovery through 2024 BTC ETF approval and new ATHs.
# Clean window: all months 2023-04 through 2024-12 pass Binance archive integrity.
# (2023-03 has a Binance outage defect across all pairs; warmup starts 2023-04.)
