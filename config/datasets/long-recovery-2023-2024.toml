# Together with long-bull-bear-2022.toml this gives two complete market-cycle
# windows for V2 research. Verify-2024h1.toml overlaps this window (2024-01 to 2024-06);
# results can be compared for consistency.
#
# Traded pairs: BTCUSDT, ETHUSDT, XRPUSDT — complete 1h and 1m archives for this period.
# No daily_warmup_start: daily (1d) archives not yet fetched; add after:
#   python -m crypto_grid_bot.backtest fetch --spec this-file.toml
# and set daily_warmup_start = "2022-10" (200 days before 2023-04).
name = "long-recovery-2023-2024"
purpose = "V2 research: 2023 recovery + 2024 ETF bull, 15 evaluation months 2023-10 to 2024-12"
