[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-crypto-grid-bot"
version = "0.1.0"
description = "Safety-first adaptive spot grid bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10",
  "mypy>=1.13",
  "pip-audit>=2.7.3",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["crypto_grid_bot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
