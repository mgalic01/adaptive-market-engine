[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-crypto-grid-bot"
version = "0.8.0"
description = "Safety-first adaptive spot grid bot"
readme = "README.md"
requires-python = ">=3.12"
# One pinned runtime dependency: the public price stream client.
dependencies = ["websockets==17.1"]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10",
  "mypy>=1.13",
  "pip-audit>=2.7.3",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Put this checkout's src/ ahead of any installed copy. Without it, pytest imports
# whatever `crypto_grid_bot` the environment resolves, which on a machine carrying an
# editable install of another checkout means this repository's tests silently exercise
# that other tree's source. The failures then look like regressions here.
pythonpath = ["src"]
