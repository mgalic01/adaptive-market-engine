name: v4-v3

# The v3_as_built arm's run on GitHub's machines, so that no heavy work runs on the owner's PC
# (owner rule 2026-10-19). V4's registered run compares itself with V3's frozen walk-forward
# selector run unchanged on V3's own inputs (the v3_as_built arm). This workflow rebuilds those
# inputs, trains V3's selector once on them, and replays the arm's four cells. The pack is the one
# V3.1's registered prepare built from V3's pinned archive inventory, whose pin (v3_pack_sha256 in
# config/v3_1_run_manifest.json) scripts/v4_v3_pack.py refuses to differ from (ruling R4 of step
# 4a). It never trades, holds no credentials, can only read the repository and commits nothing: its
# results are artifacts. It reads only Binance's public archive, data.binance.vision, through V3's
# own transport (SECURITY.md); the picks and cells jobs make no request but checkout, pip installs
# and artifact downloads.
#
# It takes no input: the manifest, the calendar and the pack's pin are fixed in the script, and
# the pack's pin is a constant of this file (V3_PACK_SHA256 below), which a test holds equal to
# the script's and the manifest's. No month from 2025-01 on is requested or read (owner decision
# v4-d03: 2025+ data is opened only for data preparation and for the registered run); V3's
# inventory ends at 2024-12. Every value reaches a script through an environment variable, never
# as text in it.
#
# Jobs:
# - pack: scripts/v4_v3_pack.py fetches every archive V3's inventory manifest lists as present,
#   each verified against its pinned SHA-256, builds the pack with V3's frozen loader and
#   assembly (v31_v3_pack.build_v3_pack), and exits 0 only if the pack's pin is V3.1's. The log
#   carries the archive count, the bytes fetched and the pin: counts and a digest, never a price.
#   The artifact v4-v3-pack holds out/ (v3-input.pack.json.gz), kept one day (owner rule
#   2026-10-19, ruling P25: download, then offer deletion). A pack that was refused uploads
#   nothing: the script step fails, and no step after it runs.
# - picks (after pack): downloads v4-v3-pack, and scripts/v4_v3_cell.py picks reads the pack
#   through V3_PACK_SHA256 and trains V3's selector once (ruling R3). Its file, v3_picks.json,
#   is the artifact v4-v3-picks, and its SHA-256, computed here from the file just written (never
#   from an input), is the job's output picks_sha256: the pin every cell then requires. The
#   script's one line says the picks' count and that digest.
# - cells (after pack and picks), one job per cell of the matrix: capital 1000 and 10000, each at
#   cost multiple 1 and 2 (fail-fast off, so one failed cell leaves the others running; 60 minutes
#   each). It downloads both artifacts, checks the picks file's SHA-256 against the picks job's
#   output before anything runs, then runs scripts/v4_v3_cell.py run under GNU time
#   (/usr/bin/time -v), whose wall time and peak memory go to out/<cell id>/timing.json
#   (scripts/v4_cells_timing.py), as in v4-cells.yml. The cell's own line (its outcome and its
#   summary's digest) goes to /dev/null, not to the public log: an outcome is a result. The
#   cell's folder is its artifact, v4-cell-v3_as_built-<capital>-<k>x: records.jsonl,
#   receipt.json, summary.json, report.html and timing.json. A cell whose replay fails uploads
#   nothing; one that replayed but whose timing could not be parsed still uploads its files,
#   without timing.json, and its job still fails.
#
# The picks file does not name its pack, so this workflow pairs them: every cell takes the pack
# through the constant pin and the picks through the picks job's output, and the script refuses
# either file that is not its pin. The logs are public: each script prints counts, ids, sizes and
# times only, never a price, an equity, a return or a cell's outcome. Every artifact is kept one
# day; the results stay on the owner's PC: download them, then offer deletion.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-v3
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# V3.1's registered pack pin (v3_pack_sha256 of config/v3_1_run_manifest.json, and
# EXPECTED_PACK_SHA256 of scripts/v4_v3_pack.py): the picks and cells jobs read the downloaded
# pack through it, so a pack that is not V3.1's is refused there as well as in the pack job.
env:
  V3_PACK_SHA256: 8a4780009bfe580995396b60fd30e52bbc21888a470e49eedb84910087a55dee

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - name: Fetch V3's archives and build its input pack
        run: python scripts/v4_v3_pack.py --work work --out out

      # out/ holds the pack alone; the archives stay in work/ and are not uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-v3-pack
          path: out/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

  picks:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      picks_sha256: ${{ steps.pin.outputs.picks_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # The pack job's artifact, of this run: v3pack/v3-input.pack.json.gz.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-v3-pack
          path: v3pack

      # The script reads the pack through its pin and refuses an existing picks file. A failed
      # step skips every step after it, the upload included.
      - name: Train V3's selector once on the pack
        run: python scripts/v4_v3_cell.py picks --pack v3pack/v3-input.pack.json.gz --pack-sha256 "$V3_PACK_SHA256" --out picks

      # The picks' pin is the digest of the file just written, never a value from outside.
      - id: pin
        name: Keep the picks file's SHA-256 as the job's output
        run: |
          digest=$(sha256sum picks/v3_picks.json | cut -d' ' -f1)
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the picks file's SHA-256 could not be read." >&2
            exit 1
          fi
          echo "picks_sha256=$digest" >> "$GITHUB_OUTPUT"

      # picks/ holds the picks file alone.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-v3-picks
          path: picks/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  cells:
    name: cell ${{ matrix.cell }}
    needs: [pack, picks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: v3_as_built-1000-1x
            capital: 1000
            costs: 1
          - cell: v3_as_built-1000-2x
            capital: 1000
            costs: 2
          - cell: v3_as_built-10000-1x
            capital: 10000
            costs: 1
          - cell: v3_as_built-10000-2x
            capital: 10000
            costs: 2
    env:
      CELL: ${{ matrix.cell }}
      CAPITAL: ${{ matrix.capital }}
      COSTS: ${{ matrix.costs }}
      PICKS_SHA256: ${{ needs.picks.outputs.picks_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # This run's own pack and picks: v3pack/v3-input.pack.json.gz and picks/v3_picks.json.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-v3-pack
          path: v3pack
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-v3-picks
          path: picks

      # The picks file must be the one the picks job wrote and pinned (the pairing: the file does
      # not name its pack). The script checks the pin again when it reads the file.
      - name: Check the picks file against the picks job's pin
        run: |
          digest=$(sha256sum picks/v3_picks.json | cut -d' ' -f1)
          if [ "$digest" != "$PICKS_SHA256" ]; then
            echo "::error::the downloaded picks file is not the one the picks job pinned." >&2
            exit 1
          fi

      - name: Check that GNU time is installed
        run: |
          if [ ! -x /usr/bin/time ]; then
            echo "::error::/usr/bin/time (GNU time) is missing, so the cell's peak memory cannot be measured." >&2
            exit 1
          fi

      # The cell writes out/<cell id>/ (records.jsonl, receipt.json, summary.json, report.html);
      # time writes out/<cell id>.time beside that folder. The cell's standard output, one line
      # with its outcome, goes to /dev/null: an outcome is a result, and the log is public. A
      # failure is still one line on standard error, the exception's type only.
      - name: Replay the cell
        run: |
          mkdir -p out
          /usr/bin/time -v -o "out/$CELL.time" \
            python scripts/v4_v3_cell.py run --pack v3pack/v3-input.pack.json.gz --pack-sha256 "$V3_PACK_SHA256" --picks picks/v3_picks.json --picks-sha256 "$PICKS_SHA256" --capital "$CAPITAL" --costs "$COSTS" --out out > /dev/null

      - id: timing
        name: Keep the cell's wall time and peak memory
        run: python scripts/v4_cells_timing.py --time-file "out/$CELL.time" --cell-dir "out/$CELL"

      # The cell's folder is the artifact's root. A timing step that failed must not discard a
      # replay that succeeded (the job still fails): the upload runs after a failed timing step,
      # and after nothing else that failed, so a failed replay uploads nothing.
      - if: ${{ success() || steps.timing.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-cell-${{ matrix.cell }}
          path: out/${{ matrix.cell }}/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
