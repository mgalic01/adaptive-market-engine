name: v4-v3

# V3's input pack on GitHub's machines, so that no heavy work runs on the owner's PC (owner rule
# 2026-10-19). V4's registered run compares itself with V3's frozen walk-forward selector run
# unchanged on V3's own inputs (the v3_as_built arm). This workflow rebuilds those inputs: the
# pack V3.1's registered prepare built from V3's pinned archive inventory, whose pin
# (v3_pack_sha256 in config/v3_1_run_manifest.json) scripts/v4_v3_pack.py refuses to differ from.
# It never trades, holds no credentials, can only read the repository and commits nothing: its
# result is an artifact. It reads only Binance's public archive, data.binance.vision, through
# V3's own transport (SECURITY.md).
#
# It takes no input: the manifest, the calendar and the pack's pin are fixed in the script. No
# month from 2025-01 on is requested or read (owner decision v4-d03: 2025+ data is opened only for
# data preparation and for the registered run); V3's inventory ends at 2024-12.
#
# Jobs:
# - pack: scripts/v4_v3_pack.py fetches every archive V3's inventory manifest lists as present,
#   each verified against its pinned SHA-256, builds the pack with V3's frozen loader and
#   assembly (v31_v3_pack.build_v3_pack), and exits 0 only if the pack's pin is V3.1's. The log
#   carries the archive count, the bytes fetched and the pin: counts and a digest, never a price.
#   The artifact v4-v3-pack holds out/ (v3-input.pack.json.gz), kept one day (owner rule
#   2026-10-19, ruling P25: download, then offer deletion).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-v3
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - name: Fetch V3's archives and build its input pack
        run: python scripts/v4_v3_pack.py --work work --out out

      # out/ holds the pack alone; the archives stay in work/ and are not uploaded.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-v3-pack
          path: out/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0
