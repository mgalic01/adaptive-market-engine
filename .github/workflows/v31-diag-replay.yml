name: v31 diagnostic replay (not part of any verdict)

# Owner decision v31-d34 (2026-10-17) and the owner's choice of 2026-10-19 to run it on
# GitHub instead of the owner's PC. Replays the 8 V3.1 W1 research cells that crashed in
# registered run 38703911852, at the run's own code (d4a4f09), with one in-memory engine
# fix (diag/v31_run_cell_patched.py). The official V3.1 verdict (FAIL) is unchanged.
# Lives only on branch claude/v31-diag-replay and runs on a push to it. Logs print one
# summary line per cell; outputs are kept for one day, downloaded to the owner's PC, then
# deleted (docs/RUN_ARCHIVE.md: run results stay local).

on:
  push:
    branches: [claude/v31-diag-replay]

permissions:
  contents: read
  actions: read

concurrency:
  group: v31-diag-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        cell:
          - w1.combined.olhc.c1.research
          - w1.combined_without_continuation.olhc.c1.research
          - w1.combined_without_discretionary_trailing.olhc.c1.research
          - w1.combined_without_discretionary_trailing.ohlc.c2.research
          - w1.combined_without_discretionary_trailing.olhc.c2.research
          - w1.combined_without_full_short_qualification.olhc.c1.research
          - w1.combined_without_funding_admission.olhc.c1.research
          - w1.combined_without_recovery.olhc.c1.research
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: d4a4f099d300ee955107c0f85254a0e7a43ea6ed
          fetch-depth: 0
          persist-credentials: false
          path: code
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: diag
          persist-credentials: false
          path: diag-branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r code/requirements-dev.lock
      - run: python -m pip install -e code --no-deps

      # The registered run's own prepared inputs (packs and prepare.json), from its
      # artifact. The cell's execution gate checks the window pack against its pin.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v31-packs
          run-id: 38703911852
          github-token: ${{ github.token }}
          path: code/v31/prepared

      - name: Replay the cell with the diagnostic engine fix
        working-directory: code
        env:
          CELL: ${{ matrix.cell }}
        run: |
          set -o pipefail
          status=0
          PYTHONPATH=src:scripts python ../diag-branch/diag/v31_run_cell_patched.py run-cell \
            --mode registered \
            --repo . \
            --registration-sha256 05b8315054ce12cdf3da8c818b1d8144f5f65a60a54e04e0d5a89bfe5867efa3 \
            --cell "$CELL" \
            --packs v31/prepared/packs \
            --attempt-id ${{ github.run_id }}-attempt-${{ github.run_attempt }} \
            --out v31/cell-out > ../replay.log 2>&1 || status=$?
          echo "run-cell exit status: $status"
          grep -m1 "DIAGNOSTIC:" ../replay.log || true
          # A refusal or crash prints its message here; a completed replay prints only
          # its one-line document (ids and hashes, no results).
          if [ "$status" -ne 0 ]; then tail -n 40 ../replay.log; else tail -c 400 ../replay.log; fi
          exit $status

      - name: One summary line
        if: always()
        env:
          CELL: ${{ matrix.cell }}
        run: |
          python - <<'PY'
          import os, re
          cell = os.environ["CELL"]
          path = os.path.join("code", "v31", "cell-out", cell, "outcome.json")
          if not os.path.exists(path):
              print(f"SUMMARY {cell}: no outcome.json")
              raise SystemExit(0)
          head = open(path, "rb").read(400_000)
          head = head[: head.find(b'"report_evidence"')]
          get = lambda k: (re.search(rb'"%s":"?([^",]*)' % k.encode(), head) or [None, b"?"])[1].decode()
          start, end = get("initial_equity"), get("final_equity")
          try:
              ret = f"{(float(end) / float(start) - 1) * 100:.2f}%"
          except ValueError:
              ret = "?"
          dd = get("max_drawdown")
          try:
              dd = f"{float(dd) * 100:.2f}%"
          except ValueError:
              pass
          print(f"SUMMARY {cell}: complete={get('complete')} return={ret} max_drawdown={dd} liquidations={get('liquidations')}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diag-replay-${{ matrix.cell }}
          path: code/v31/cell-out
          retention-days: 1
          if-no-files-found: warn
