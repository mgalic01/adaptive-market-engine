name: Codex worker containment (dummy auth only)

on:
  pull_request:
    paths:
      - scripts/local_worker.py
      - tests/test_remote_worker_containment.py
      - .github/workflows/codex-worker-containment.yml
  push:
    branches: [main]
    paths:
      - scripts/local_worker.py
      - tests/test_remote_worker_containment.py
      - .github/workflows/codex-worker-containment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cli-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Fetch and verify pinned public CLI without package scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/codex-boundary"
          cd "$RUNNER_TEMP/codex-boundary"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            'https://registry.npmjs.org/@openai/codex/-/codex-0.157.1-linux-x64.tgz' \
            --output codex.tgz
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          expected = 'Eac8XlC0nCXSeUjDU9l8yLJ6P9evv1mO+AnvILoNwlegBC7B3AVXqJ05QcMhQX7RcJ3Lk2618ykCb2X2ui8VAQ=='
          actual = base64.b64encode(hashlib.sha512(Path('codex.tgz').read_bytes()).digest()).decode()
          if actual != expected:
              raise SystemExit('CLI archive integrity mismatch')
          PY
          # Extract only the verified executable; no archive paths become write targets.
          python - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('codex.tgz', 'r:gz') as archive:
              members = [m for m in archive.getmembers() if m.isfile() and m.name.endswith('/bin/codex')]
              if len(members) != 1:
                  raise SystemExit('Unexpected CLI executable layout')
              member = members[0]
              if member.size > 500_000_000:
                  raise SystemExit('CLI executable exceeds size bound')
              source = archive.extractfile(member)
              if source is None:
                  raise SystemExit('Missing CLI executable')
              Path('codex').write_bytes(source.read())
          PY
          chmod 700 codex
          ./codex --version
          echo "CODEX_TEST_EXECUTABLE=$RUNNER_TEMP/codex-boundary/codex" >> "$GITHUB_ENV"
      - name: Verify tool rejection and negative control without real credentials
        run: python -m pytest tests/test_remote_worker_containment.py -v
