name: Claude review for Codex
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # if you chose an API key instead: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}  PR: #${{ github.event.pull_request.number }}
            Review this PR's diff. The project is a paper-only, fail-closed spot grid bot (see README.md, ROADMAP.md, SECURITY.md).
            Check: correctness, Decimal/precision and fee math, risk guards and fail-closed behaviour, no live-trading or API-key leakage,
            test coverage for new logic, and consistency with the agreed operating rules in README.md.
            Run: pip install -e .[dev] && pytest -q && ruff check . && mypy
            Post ONE PR comment via `gh pr comment`, written as instructions for the OpenAI Codex agent:
            a verdict (APPROVE / CHANGES NEEDED), then a numbered list of concrete required fixes with file:line, then optional nits.
            If changes are needed, end the comment with: "@codex please address the required fixes above."
          claude_args: '--allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(pip install:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*)"'
