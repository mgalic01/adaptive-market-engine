name: backtest

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Dataset spec name (without .toml)"
        required: true
        default: "long-recovery-2023-2024"
        type: choice
        options:
          - long-bull-bear-2022
          - long-recovery-2023-2024
          - practice-2022
          - verify-2024h1
          - full-range-2019-2024
      variant:
        description: "Spec v1 variant: V0 (baseline), A (daily trend switch; needs daily_warmup_start), B (40% inventory cap) or C (A and B)"
        required: false
        default: "V0"
        type: choice
        options:
          - "V0"
          - "A"
          - "B"
          - "C"
      structure:
        description: "Enable the V2 market-structure features (off in V0; results labelled +structure-v2)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - name: Fetch data
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: |
          python -m crypto_grid_bot.backtest fetch \
            --spec "config/datasets/$SPEC.toml" \
            --data-dir data

      # run_nopool.py is the CLI's run with --jobs 1: it verifies the dataset and runs
      # the integrity cross-checks before any replay, and takes the fees from the spec.
      - name: Run backtest
        env:
          SPEC: ${{ github.event.inputs.spec }}
          VARIANT: ${{ github.event.inputs.variant }}
          STRUCTURE: ${{ github.event.inputs.structure }}
        run: |
          set -- "$SPEC"
          case "$VARIANT" in
            A) set -- "$@" --variant-a ;;
            B) set -- "$@" --variant-b ;;
            C) set -- "$@" --variant-c ;;
          esac
          if [ "$STRUCTURE" = "true" ]; then
            set -- "$@" --structure
          fi
          python scripts/run_nopool.py "$@"

      # An invalid run (exit 2) still writes results.json: upload it for diagnosis.
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.event.inputs.spec }}
          path: data/backtests/${{ github.event.inputs.spec }}/
          retention-days: 30
