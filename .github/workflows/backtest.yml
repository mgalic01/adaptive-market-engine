name: backtest

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Dataset spec name (without .toml)"
        required: true
        default: "long-recovery-2023-2024"
        type: choice
        options:
          - long-bull-bear-2022
          - long-recovery-2023-2024
          - practice-2022
          - verify-2024h1
          - full-range-2019-2024
          - full-range-2017-2024
      variant:
        description: "Spec v1 variant: V0 (baseline), A (daily trend switch; needs daily_warmup_start), B (40% inventory cap), C (A and B), E (volume-confirmed exit), F (order-flow block), G (funding gate; needs the manifest's BTCUSDT funding archives for the evaluation months from 2020-01), H (cycle context; needs daily_warmup_start), C+G, C+H, or C+F+G+H+V2 (the full stack: C with F, G, H and the V2 structure features, which it turns on itself). V2 alone is V0 with structure true. Or MS, spec v2's mode switcher (Grid with F's block, Uptrend or Cash; needs daily_warmup_start; structure false)."
        required: false
        default: "V0"
        type: choice
        options:
          - "V0"
          - "A"
          - "B"
          - "C"
          - "E"
          - "F"
          - "G"
          - "H"
          - "C+G"
          - "C+H"
          - "C+F+G+H+V2"
          - "MS"
      structure:
        description: "Enable the V2 market-structure features (off in V0; results labelled +structure-v2)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      trend_benchmark:
        description: "Also run variant D, the trend benchmark (spec v1 §3 D). Spec v1's acceptance scorer reads D from the V0 run's results. Spec v2's scorer reads it from the MS run's, so set it on the MS runs only, one per window: it refuses a V0 run's file, and a second D row for a pair and path."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      maker_fee:
        description: "Maker fee for resting fills. The default is spec v1's primary maker fee (§4), which the acceptance scorer requires; empty keeps the dataset spec's fee."
        required: false
        default: "0"
        type: string
      taker_fee:
        description: "Taker fee for marketable exits. The default is spec v1's primary taker fee (§4), which the acceptance scorer requires; empty means the maker fee."
        required: false
        default: "0.0009"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # A registered long window is scored against its committed manifest, which pins every
      # archive's checksum. Before that manifest exists, the fetch below would write an
      # untracked one and the run would use it: a long, unpinned run the acceptance scorer
      # refuses. So a full-range dispatch stops here, before any fetch, until it is committed.
      - name: Require a committed manifest for a registered long window
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: |
          case "$SPEC" in
            full-range-*)
              manifest="config/datasets/$SPEC.manifest.json"
              if ! git ls-files --error-unmatch "$manifest" > /dev/null 2>&1; then
                echo "::error::$SPEC is a registered long window; dispatch it once $manifest is committed."
                exit 1
              fi
              ;;
          esac

      - name: Fetch data
        env:
          SPEC: ${{ github.event.inputs.spec }}
        run: |
          python -m crypto_grid_bot.backtest fetch \
            --spec "config/datasets/$SPEC.toml" \
            --data-dir data
          # The fetch rewrites the manifest with today's exchange filters and time. A run
          # must use and record the committed manifest, which the acceptance scorer pins,
          # and a changed tracked file would record the code commit as "+dirty". The run
          # verifies every downloaded archive against the committed manifest's checksums.
          manifest="config/datasets/$SPEC.manifest.json"
          if git ls-files --error-unmatch "$manifest" > /dev/null 2>&1; then
            git checkout -- "$manifest"
          fi

      # run_nopool.py is the CLI's run with --jobs 1: it verifies the dataset and runs
      # the integrity cross-checks before any replay. The fee inputs default to spec v1's
      # primary fees, so a dispatch left at its defaults writes runs the acceptance scorer
      # accepts; an emptied input falls back to the dataset spec's fee. --record-commit
      # records the code commit and its source hash in every results.json, which the
      # acceptance scorer requires of every input; a variant, structure or D run records
      # them anyway.
      - name: Run backtest
        env:
          SPEC: ${{ github.event.inputs.spec }}
          VARIANT: ${{ github.event.inputs.variant }}
          STRUCTURE: ${{ github.event.inputs.structure }}
          TREND_BENCHMARK: ${{ github.event.inputs.trend_benchmark }}
          MAKER_FEE: ${{ github.event.inputs.maker_fee }}
          TAKER_FEE: ${{ github.event.inputs.taker_fee }}
        run: |
          set -- "$SPEC" --record-commit
          case "$VARIANT" in
            A) set -- "$@" --variant-a ;;
            B) set -- "$@" --variant-b ;;
            C) set -- "$@" --variant-c ;;
            E) set -- "$@" --variant-e ;;
            F) set -- "$@" --variant-f ;;
            G) set -- "$@" --variant-g ;;
            H) set -- "$@" --variant-h ;;
            C+G) set -- "$@" --variant-cg ;;
            C+H) set -- "$@" --variant-ch ;;
            C+F+G+H+V2) set -- "$@" --variant-full ;;
            MS) set -- "$@" --mode-switch ;;
          esac
          if [ "$STRUCTURE" = "true" ]; then
            set -- "$@" --structure
          fi
          if [ "$TREND_BENCHMARK" = "true" ]; then
            set -- "$@" --trend-benchmark
          fi
          if [ -n "$MAKER_FEE" ]; then
            set -- "$@" --maker-fee "$MAKER_FEE"
          fi
          if [ -n "$TAKER_FEE" ]; then
            set -- "$@" --taker-fee "$TAKER_FEE"
          fi
          python scripts/run_nopool.py "$@"

      # An invalid run (exit 2) still writes results.json: upload it for diagnosis.
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.event.inputs.spec }}
          path: data/backtests/${{ github.event.inputs.spec }}/
          retention-days: 30
