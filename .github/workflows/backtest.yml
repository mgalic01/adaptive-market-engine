name: backtest

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Dataset spec name (without .toml)"
        required: true
        default: "long-recovery-2023-2024"
        type: choice
        options:
          - long-bull-bear-2022
          - long-recovery-2023-2024
          - practice-2022
          - verify-2024h1
          - full-range-2019-2024
      variant_a:
        description: "Run Variant A (daily SMA50/SMA200 trend switch) — requires daily_warmup_start in spec"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - name: Fetch data
        run: |
          python -m crypto_grid_bot.backtest fetch \
            --spec config/datasets/${{ github.event.inputs.spec }}.toml \
            --data-dir data

      - name: Run backtest
        run: |
          ARGS="${{ github.event.inputs.spec }}"
          if [ "${{ github.event.inputs.variant_a }}" = "true" ]; then
            ARGS="$ARGS --variant-a"
          fi
          python scripts/run_nopool.py $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.event.inputs.spec }}
          path: data/backtests/${{ github.event.inputs.spec }}/
          retention-days: 30
