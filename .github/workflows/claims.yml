name: claims

# Claims on PRs and issues (docs/AGENT_HANDOFF.md, "Claims"). Sets the `claim-guard`
# commit status on a PR's head and the `claimed` label, and answers a rejected claim.
# No timer: the handbook allows no scheduled watcher, so a claim's expiry shows at the
# next event (a push, or a comment containing /claim, /release or /claims). Runs no
# agent. `pull_request_target` runs this workflow file from main, not from the PR, and
# the job checks out main only and never the PR's code, so a PR can change neither the
# workflow nor the script that judges its own claims (automated review, PR #141).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: write

jobs:
  claims:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.comment.author_association == 'OWNER' &&
       (contains(github.event.comment.body, '/claim') ||
        contains(github.event.comment.body, '/release')))
    concurrency:
      group: claims-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate claims
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No fallback: a missing script fails the job instead of passing silently.
        run: python scripts/claims.py workflow
