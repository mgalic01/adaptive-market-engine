name: v31-run
# Each run's title names its mode and registration: a registered dispatch is
# "v31-run registered <registration_sha256>", which the dispatch check below looks for.
run-name: v31-run ${{ inputs.mode }} ${{ inputs.registration_sha256 }}

# The V3.1 run driver (scripts/v31_driver.py) on GitHub's machines. It never trades, holds no
# stored credentials, can only read the repository and commits nothing: its results are
# artifacts. Two steps get the job's own token, with read access to this repository's
# workflow runs and nothing more: the plan job's dispatch check (a registered run's, and a
# rehearsal's report-only one), and the Aggregate step, which holds it in a rehearsal too,
# where the driver does not use it.
#
# OPERATING RULE: never dispatch v31-run while another v31-run is queued or running. The
# concurrency group below asks GitHub to queue dispatches (queue: max) rather than keep one
# pending run and cancel it when a newer one arrives, but nothing in this repository shows that
# the key is honoured at workflow level, so the rule stands either way. Never cancel a
# queued or running registered dispatch either: a cancelled launch counts as an execution
# of its registration.
#
# THE DISPATCH REF: a registered or timing run is dispatched from a ref whose tree is the
# code pin plus the registration artifacts only (config/v3_1_*.json, the FX record,
# docs/trials/register.jsonl, docs/reviews/**, docs/tasks/**). In a registered run the plan
# job checks it first (the driver's job gate: nothing else changed since the registration's
# code pin), so a wrong ref fails in the first job, and every later job checks it again; a
# timing run's checkout must be the dispatched code_commit, with no change.
#
# A dispatch picks one of five modes:
#
# - smoke: one job runs the driver's offline, synthetic end-to-end run (all 216 cells) and
#   uploads its summary. It needs no registration and fetches nothing beyond pip's packages.
# - prepare-only: one job fetches and verifies the public archives and builds the packs, with
#   no replay, for a registration that does not exist yet. The checkout must be at the
#   dispatched code_commit. It uploads the packs and prepare.json (v31-packs) and prints
#   prepare.json.
# - timing: three jobs measure the registered run's heavy steps before registration, gated
#   like prepare-only (code_commit and the prepare config's hash; no registration): the
#   whole prepare; the real V3 input pack and V3's real walk-forward picks (the inventory
#   alone fetched); and one real W1 minute cell, V2's grid (the legacy dataset alone
#   fetched). Each step has its own step timeout; whatever a part computes is discarded, and
#   each uploads only its elapsed times, peak memory and, for the picks, V3's attempt
#   bookkeeping without any result (v31-timing-<part>-attempt-<n>), also when it timed out.
#   No outcome, report or equity value is uploaded or printed.
# - rehearsal: the registered job graph below, every job and artifact hand-off, on a
#   synthetic rehearsal world the plan job builds in-job: a git repository whose code pin
#   commits the rehearsal marker (so the real gate, adapter pins and change check run on
#   it) and a registration on top. Only a rehearsal runs the smoke's stand-ins, and a
#   registered run refuses any world built for one. It fetches nothing; rehearsal_cells
#   runs only the first N cells (at least 6), all 216 by default. Its verdict names its
#   mode, and its summary and status are uploaded under rehearsal names, so a synthetic
#   PASS never passes for the registered run's.
# - registered: the registered experiment, once. plan checks that
#   config/v3_1_registration.json hashes to the dispatched registration_sha256, refuses a
#   second dispatch of it, runs the job gate and lists the cells; prepare builds the packs;
#   picks computes V3's selector picks once; run-main and run-v3 run one matrix job per cell
#   (only the four selector cells wait for the picks); aggregate judges what exists,
#   whether or not every cell finished, and uploads the summary; status records every
#   job's result, aggregate run or skipped.
#
# Artifacts (all kept for the maximum retention, 90 days):
# - v31-rehearsal-world: rehearsal-world.tar, the world (repo/ and legacy/), rehearsal only
# - v31-packs: packs/window-<id>.pack.json.gz, packs/v3-input.pack.json.gz, prepare.json
# - v31-legacy-data: the verified legacy dataset (binance/data/...) for the minute cells
# - v3-picks-attempt-<n>: v3_picks/ (the picks job's directory)
# - cell-<cell_id>-attempt-<n>: <cell_id>/ (one cell's directory)
# - v31-summary-attempt-<n>: summary/ (the verdict); v31-smoke-summary-attempt-<n>: the
#   smoke's summary; v31-status-attempt-<n>: status.json, every job's result; in a
#   rehearsal v31-rehearsal-summary-attempt-<n> and v31-rehearsal-status-attempt-<n>
# - v31-timing-<part>-attempt-<n>: the timing files of one timing part
# Aggregation reads each cell and picks artifact in its own folder, named for the artifact
# (cells/cell-<id>-attempt-<n>/<id>/): it accepts no other layout.
#
# Every attempt is recorded. A run job (picks, run-main, run-v3) uploads its directory even
# when it fails or times out (if: always()), so a failed attempt leaves its folder and its
# claim; a job killed before it wrote anything only warns. The one exception stops the line:
# the upload also requires the scan before it to have succeeded (if: always() &&
# steps.guard_outputs.outcome == 'success'; the scan itself runs after a failed step, if:
# always()). If that scan fails, is cancelled or is skipped, nothing is uploaded and the run
# is void; a failed scan also fails the job. The long steps have a step timeout of 335
# minutes, inside the 360-minute job limit, so the scan and the upload still run after one
# is killed.
#
# A registered run is executed once. Re-running any job, whether every job or only the failed
# ones, is a new recorded attempt (a new run_attempt number). Aggregate records every
# folder's attempt number and every claim's run id. When it finds two folders for the same
# cell, or two picks folders, it refuses the duplicate; a cell or the picks job from an
# attempt other than 1, or from another run, makes the verdict incomplete (re-run
# detected), a lone re-run folder included. Either way a re-run voids that run's verdict,
# by design. Do not re-run a registered run. A re-run of
# every job also fails closed at the v31-packs upload, whose name is fixed. Re-running
# aggregate alone is harmless: its summary is named for its attempt, and the cell folders
# are unchanged.
#
# A second dispatch of a registration is refused too, since it gets a new run id and
# attempt 1, which no folder can tell from the first. The run-name above titles every run
# with its mode and registration, and the plan job (first) and the aggregate (again) list
# this workflow's runs through GitHub's API: another registered run of the same
# registration created before this one or at the same time, queued, running or finished,
# fails the plan and leaves the verdict incomplete, as does any failure of the check. A
# launch that stopped at the plan job with nothing run does not count: GitHub's records
# must show it completed, its plan job failed and every later job skipped in every
# attempt (the status job aside), and anything else counts. Transient GitHub errors (no
# reply, a timeout, a reply cut short, HTTP 5xx or 429, a rate limit, a run not yet listed)
# are retried, five attempts over about five minutes, before the check fails closed; the
# whole check stops at a 20-minute deadline, and no later than 25 minutes after its job
# started (the job's first step records the start), so a long outage fails the plan job
# (not counted) instead of running into its 30-minute timeout, which cancels it (counted).
# A rehearsal runs the same check report-only, on its own title, to prove it against
# GitHub. A dispatch created a second or more later never counts against an earlier one,
# but two dispatches created in the same second void each other, and one created while an
# earlier run's plan or aggregate is paging through the runs can make that listing
# inconsistent, which fails that plan or leaves that verdict incomplete (fail closed). The
# operating rule above forbids both.
#
# No archive for 2025-01 or later may exist anywhere on a runner. The driver refuses such a
# month before it fetches; the "Refuse any file named for 2025 or later" step is a second,
# independent check. It runs after every step that fetches or downloads data, and again just
# before every upload, so what the driver wrote is scanned too. It fails on any error of the
# scan itself, not only on a match.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (offline, synthetic), prepare-only (fetch and pack, no replay), timing (time the heavy steps, results discarded), rehearsal (the registered job graph on a synthetic world) or registered (the registered experiment)"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - prepare-only
          - timing
          - rehearsal
          - registered
      registration_sha256:
        description: "registered: SHA-256 of config/v3_1_registration.json, 64 lowercase hex"
        required: false
        default: ""
        type: string
      code_commit:
        description: "prepare-only and timing: the 40-hex commit this checkout must be at"
        required: false
        default: ""
        type: string
      rehearsal_cells:
        description: "rehearsal: run only the first N cells (at least 6); empty runs all 216"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One v31-run at a time. cancel-in-progress: false keeps the run in progress. Without a queue
# GitHub keeps one pending run per group and cancels it when a newer one arrives, so a queued
# registered run could be dropped; queue: max keeps every pending dispatch (the Bob workflows
# use it at job level; no test or document here shows workflow-level support, hence the
# operating rule in the header).
concurrency:
  group: v31-run
  cancel-in-progress: false
  queue: max

# The dispatch's inputs reach scripts through the environment, never spliced into them.
# REPO is the checkout a registered job gates: the repository itself, or in a rehearsal the
# synthetic world the plan job builds.
env:
  MODE: ${{ inputs.mode }}
  REGISTRATION_SHA256: ${{ inputs.registration_sha256 }}
  CODE_COMMIT: ${{ inputs.code_commit }}
  REHEARSAL_CELLS: ${{ inputs.rehearsal_cells }}
  REPO: ${{ inputs.mode == 'rehearsal' && 'v31/work/repo' || '.' }}

defaults:
  run:
    shell: bash

jobs:
  smoke:
    if: ${{ inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - name: Run the smoke
        run: |
          python scripts/v31_driver.py smoke --out v31/smoke > "$RUNNER_TEMP/smoke.json"
          cat "$RUNNER_TEMP/smoke.json"

      - name: Stage the smoke summary
        run: |
          mkdir v31/smoke-summary
          cp "$RUNNER_TEMP/smoke.json" v31/smoke-summary/smoke.json
          summary="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"])' "$RUNNER_TEMP/smoke.json")"
          cp -r "$summary" v31/smoke-summary/summary

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" > "$RUNNER_TEMP/untracked.txt"
          # grep exits 1 when nothing matches, which is the pass. Any other non-zero status is
          # a broken scan and fails the step, as does a failure of git, find, sort or comm.
          status=0
          grep -E -- '-202[5-9]-|-20[3-9][0-9]-' "$RUNNER_TEMP/untracked.txt" > "$RUNNER_TEMP/found.txt" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::The scan for files named for 2025 or later failed (grep exit $status)."
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/found.txt" ]; then
            cat "$RUNNER_TEMP/found.txt"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v31-smoke-summary-attempt-${{ github.run_attempt }}
          path: v31/smoke-summary
          if-no-files-found: error
          retention-days: 90

  plan:
    if: ${{ (inputs.mode == 'registered' || inputs.mode == 'rehearsal') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets the dispatch check list this workflow's runs; nothing is written.
    permissions:
      contents: read
      actions: read
    outputs:
      v3_cells: ${{ steps.cells.outputs.v3_cells }}
      main_cells: ${{ steps.cells.outputs.main_cells }}
      registration_sha256: ${{ steps.cells.outputs.registration_sha256 }}
    steps:
      # First of all: the job's start, from which the dispatch check budgets its deadline
      # (25 of the job's 30 minutes), whatever the checkout and the installs take.
      - name: Record the job's start
        run: echo "V31_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The first step after the checkout: nothing runs on a registration other than the
      # one the dispatcher named.
      - name: Verify the registration against the dispatched SHA-256
        if: ${{ inputs.mode == 'registered' }}
        run: |
          if ! printf '%s' "$REGISTRATION_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::registered mode needs registration_sha256: 64 lowercase hex."
            exit 1
          fi
          actual="$(sha256sum config/v3_1_registration.json | cut -d' ' -f1)"
          if [ "$actual" != "$REGISTRATION_SHA256" ]; then
            echo "::error::config/v3_1_registration.json has SHA-256 $actual, not the dispatched $REGISTRATION_SHA256."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # A registration is dispatched once: this workflow's runs, listed through GitHub's
      # API, must hold no other registered dispatch of it created before or with this run,
      # unless GitHub's records show that launch stopped at this job with nothing run. The
      # first driver step; only it and the Aggregate step hold the token. A rehearsal runs
      # the same check report-only, on its own title: it prints what a registered check
      # would decide and fails only when GitHub cannot be read, which proves the access,
      # the permissions and the paging before a registered run.
      - name: Refuse a second dispatch of the registration
        if: ${{ inputs.mode == 'registered' || inputs.mode == 'rehearsal' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = registered ]; then
            python scripts/v31_driver.py dispatch-check --registration-sha256 "$REGISTRATION_SHA256"
          elif [ "$MODE" = rehearsal ]; then
            python scripts/v31_driver.py dispatch-check --report-only --registration-sha256 "$REGISTRATION_SHA256"
          else
            echo "::error::The dispatch check runs in registered and rehearsal mode only, not $MODE."
            exit 1
          fi

      # A rehearsal's world: its code pin (the smoke world, this checkout's package and the
      # rehearsal marker) and its registration on top, built here once and handed to every
      # later job as one archive.
      - name: Build the rehearsal world
        id: world
        if: ${{ inputs.mode == 'rehearsal' }}
        run: |
          python scripts/v31_driver.py rehearsal-world --out v31/work > "$RUNNER_TEMP/world.json"
          cat "$RUNNER_TEMP/world.json"
          sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["registration_sha256"])' "$RUNNER_TEMP/world.json")"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'
          echo "registration_sha256=$sha" >> "$GITHUB_OUTPUT"
          tar -cf v31/rehearsal-world.tar -C v31/work .

      # The job gate on the dispatched ref, first of all jobs, then the two matrices: the four
      # selector cells, which need the picks job, and every other cell. GitHub runs at most
      # 256 jobs from one matrix.
      - name: Plan the run
        id: cells
        env:
          REGISTRATION_SHA256: ${{ inputs.mode == 'rehearsal' && steps.world.outputs.registration_sha256 || inputs.registration_sha256 }}
        run: |
          python scripts/v31_driver.py plan \
            --mode "$MODE" \
            --repo "$REPO" \
            --registration-sha256 "$REGISTRATION_SHA256" \
            --cells "$REHEARSAL_CELLS" > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          python - "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="ascii") as handle:
              plan = json.load(handle)
          for key in ("v3_cells", "main_cells"):
              print(key + "=" + json.dumps(plan[key], separators=(",", ":")))
          print("registration_sha256=" + plan["registration_sha256"])
          PY

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" > "$RUNNER_TEMP/untracked.txt"
          # grep exits 1 when nothing matches, which is the pass. Any other non-zero status is
          # a broken scan and fails the step, as does a failure of git, find, sort or comm.
          status=0
          grep -E -- '-202[5-9]-|-20[3-9][0-9]-' "$RUNNER_TEMP/untracked.txt" > "$RUNNER_TEMP/found.txt" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::The scan for files named for 2025 or later failed (grep exit $status)."
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/found.txt" ]; then
            cat "$RUNNER_TEMP/found.txt"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.mode == 'rehearsal' }}
        with:
          name: v31-rehearsal-world
          path: v31/rehearsal-world.tar
          if-no-files-found: error
          retention-days: 90

  prepare:
    needs: plan
    # plan is skipped in prepare-only mode; !cancelled() keeps prepare from being skipped
    # with it, and a failed or skipped plan still stops a registered run or a rehearsal.
    if: ${{ !cancelled() && (inputs.mode == 'prepare-only' || ((inputs.mode == 'registered' || inputs.mode == 'rehearsal') && needs.plan.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # The registration this run is gated on: the plan job checked it first (the dispatched
    # one in a registered run, the world's in a rehearsal).
    env:
      REGISTRATION_SHA256: ${{ needs.plan.outputs.registration_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the code commit
        if: ${{ inputs.mode == 'prepare-only' }}
        run: |
          if ! printf '%s' "$CODE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::prepare-only mode needs code_commit: 40 lowercase hex."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ inputs.mode == 'rehearsal' }}
        with:
          name: v31-rehearsal-world
          path: v31/world-download
      - name: Unpack the rehearsal world
        if: ${{ inputs.mode == 'rehearsal' }}
        run: |
          mkdir -p v31/work
          tar -xf v31/world-download/rehearsal-world.tar -C v31/work

      # A rehearsal fetches nothing: v31/work/legacy is the world's synthetic dataset.
      - name: Prepare (registered or rehearsal)
        if: ${{ (inputs.mode == 'registered' || inputs.mode == 'rehearsal') }}
        timeout-minutes: 335
        run: |
          python scripts/v31_driver.py prepare --mode "$MODE" \
            --repo "$REPO" \
            --registration-sha256 "$REGISTRATION_SHA256" \
            --work v31/work --out v31/out

      # No registration exists yet, so the gate pins the checkout to the dispatched commit.
      # The prepare config's own SHA-256 is read from the checkout here: the commit is the
      # pin, and prepare.json (printed below) records the config's hash for the registration.
      - name: Prepare (prepare-only)
        if: ${{ inputs.mode == 'prepare-only' }}
        timeout-minutes: 335
        run: |
          prepare_sha256="$(sha256sum config/v3_1_prepare.json | cut -d' ' -f1)"
          python scripts/v31_driver.py prepare --mode prepare-only \
            --code-commit "$CODE_COMMIT" \
            --prepare-sha256 "$prepare_sha256" \
            --work v31/work --out v31/out

      - name: Print prepare.json
        run: cat v31/out/prepare.json

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" > "$RUNNER_TEMP/untracked.txt"
          # grep exits 1 when nothing matches, which is the pass. Any other non-zero status is
          # a broken scan and fails the step, as does a failure of git, find, sort or comm.
          status=0
          grep -E -- '-202[5-9]-|-20[3-9][0-9]-' "$RUNNER_TEMP/untracked.txt" > "$RUNNER_TEMP/found.txt" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::The scan for files named for 2025 or later failed (grep exit $status)."
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/found.txt" ]; then
            cat "$RUNNER_TEMP/found.txt"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      # v31/out holds packs/ and prepare.json: the artifact's root is that folder.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v31-packs
          path: v31/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      # The minute cells' dataset: the artifact's root holds binance/.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ (inputs.mode == 'registered' || inputs.mode == 'rehearsal') }}
        with:
          name: v31-legacy-data
          path: v31/work/legacy
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  picks:
    needs: [plan, prepare]
    if: ${{ (inputs.mode == 'registered' || inputs.mode == 'rehearsal') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # The registration this run is gated on: the plan job checked it first (the dispatched
    # one in a registered run, the world's in a rehearsal).
    env:
      REGISTRATION_SHA256: ${{ needs.plan.outputs.registration_sha256 }}
    outputs:
      picks_receipt_sha256: ${{ steps.picks.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

