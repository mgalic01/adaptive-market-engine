name: v31-run

# The V3.1 run driver (scripts/v31_driver.py) on GitHub's machines. It never trades, holds no
# credentials, can only read the repository and commits nothing: its results are artifacts.
# A dispatch picks one of three modes:
#
# - smoke: one job runs the driver's offline, synthetic end-to-end run (all 216 cells) and
#   uploads its summary. It needs no registration and fetches nothing beyond pip's packages.
# - prepare-only: one job fetches and verifies the public archives and builds the packs, with
#   no replay, for a registration that does not exist yet. The checkout must be at the
#   dispatched code_commit. It uploads the packs and prepare.json (v31-packs) and prints
#   prepare.json.
# - registered: the registered experiment, once. plan checks that
#   config/v3_1_registration.json hashes to the dispatched registration_sha256 and lists its
#   cells; prepare builds the packs; picks computes V3's selector picks once; run-main and
#   run-v3 run one matrix job per cell (the V3 cells wait for the picks); aggregate judges
#   what exists, whether or not every cell finished, and uploads the summary.
#
# Artifacts (all kept for the maximum retention, 90 days):
# - v31-packs: packs/window-<id>.pack.json.gz, packs/v3-input.pack.json.gz, prepare.json
# - v31-legacy-data: the verified legacy dataset (binance/data/...) for the minute cells
# - v3-picks-attempt-<n>: v3_picks/ (the picks job's directory)
# - cell-<cell_id>-attempt-<n>: <cell_id>/ (one cell's directory)
# - v31-summary: summary/ (the verdict); v31-smoke-summary: the smoke's summary
# Aggregation reads each cell and picks artifact in its own folder, named for the artifact
# (cells/cell-<id>-attempt-<n>/<id>/): it accepts no other layout.
#
# A failed job can be re-run from the Actions page. It then uploads under the new attempt
# number; nothing overwrites an earlier attempt's artifact. Re-running every job fails at
# the first upload, because v31-packs already exists: the registered run happens once.
#
# No archive for 2025-01 or later may exist anywhere on a runner. The driver refuses such a
# month before it fetches; the "Refuse any file named for 2025 or later" step is a second,
# independent check on every job that fetches or downloads data.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (offline, synthetic), prepare-only (fetch and pack, no replay) or registered (the registered experiment)"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - prepare-only
          - registered
      registration_sha256:
        description: "registered: SHA-256 of config/v3_1_registration.json, 64 lowercase hex"
        required: false
        default: ""
        type: string
      code_commit:
        description: "prepare-only: the 40-hex commit this checkout must be at"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One v31-run at a time, and a second dispatch never cancels the run in progress.
concurrency:
  group: v31-run
  cancel-in-progress: false

# The dispatch's text inputs reach scripts through the environment, never spliced into them.
env:
  REGISTRATION_SHA256: ${{ inputs.registration_sha256 }}
  CODE_COMMIT: ${{ inputs.code_commit }}

defaults:
  run:
    shell: bash

jobs:
  smoke:
    if: ${{ inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - name: Run the smoke
        run: |
          python scripts/v31_driver.py smoke --out v31/smoke > "$RUNNER_TEMP/smoke.json"
          cat "$RUNNER_TEMP/smoke.json"

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          found="$(find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" \
            | grep -E -- '-202[5-9]-|-20[3-9][0-9]-' || true)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      - name: Stage the smoke summary
        run: |
          mkdir v31/smoke-summary
          cp "$RUNNER_TEMP/smoke.json" v31/smoke-summary/smoke.json
          summary="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"])' "$RUNNER_TEMP/smoke.json")"
          cp -r "$summary" v31/smoke-summary/summary

      - uses: actions/upload-artifact@v4
        with:
          name: v31-smoke-summary
          path: v31/smoke-summary
          if-no-files-found: error
          retention-days: 90

  plan:
    if: ${{ inputs.mode == 'registered' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      v3_cells: ${{ steps.cells.outputs.v3_cells }}
      main_cells: ${{ steps.cells.outputs.main_cells }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The first step after the checkout: nothing runs on a registration other than the
      # one the dispatcher named.
      - name: Verify the registration against the dispatched SHA-256
        run: |
          if ! printf '%s' "$REGISTRATION_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::registered mode needs registration_sha256: 64 lowercase hex."
            exit 1
          fi
          actual="$(sha256sum config/v3_1_registration.json | cut -d' ' -f1)"
          if [ "$actual" != "$REGISTRATION_SHA256" ]; then
            echo "::error::config/v3_1_registration.json has SHA-256 $actual, not the dispatched $REGISTRATION_SHA256."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # V3's cells need the picks job; every other cell does not. Each array is one matrix,
      # and GitHub runs at most 256 jobs from one.
      - name: List the registered cells
        id: cells
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          from crypto_grid_bot.combined.driver.registration import load_registration

          reg = load_registration("config/v3_1_registration.json", "config/v3_1_run_manifest.json")
          v3_cells = [cell.cell_id for cell in reg.cells if cell.kind == "v3"]
          main_cells = [cell.cell_id for cell in reg.cells if cell.kind != "v3"]
          for name, cells in (("v3_cells", v3_cells), ("main_cells", main_cells)):
              if not 0 < len(cells) <= 256:  # GitHub's limit on one matrix
                  sys.exit(f"{name}: {len(cells)} cells; a matrix takes 1 to 256")
          print("v3_cells=" + json.dumps(v3_cells, separators=(",", ":")))
          print("main_cells=" + json.dumps(main_cells, separators=(",", ":")))
          PY

  prepare:
    needs: plan
    # plan is skipped in prepare-only mode; !cancelled() keeps prepare from being skipped
    # with it, and a failed or skipped plan still stops a registered run.
    if: ${{ !cancelled() && (inputs.mode == 'prepare-only' || (inputs.mode == 'registered' && needs.plan.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the code commit
        if: ${{ inputs.mode == 'prepare-only' }}
        run: |
          if ! printf '%s' "$CODE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::prepare-only mode needs code_commit: 40 lowercase hex."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - name: Prepare (registered)
        if: ${{ inputs.mode == 'registered' }}
        run: |
          python scripts/v31_driver.py prepare --mode registered \
            --registration-sha256 "$REGISTRATION_SHA256" \
            --work v31/work --out v31/out

      # No registration exists yet, so the gate pins the checkout to the dispatched commit.
      # The prepare config's own SHA-256 is read from the checkout here: the commit is the
      # pin, and prepare.json (printed below) records the config's hash for the registration.
      - name: Prepare (prepare-only)
        if: ${{ inputs.mode == 'prepare-only' }}
        run: |
          prepare_sha256="$(sha256sum config/v3_1_prepare.json | cut -d' ' -f1)"
          python scripts/v31_driver.py prepare --mode prepare-only \
            --code-commit "$CODE_COMMIT" \
            --prepare-sha256 "$prepare_sha256" \
            --work v31/work --out v31/out

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          found="$(find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" \
            | grep -E -- '-202[5-9]-|-20[3-9][0-9]-' || true)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      - name: Print prepare.json
        run: cat v31/out/prepare.json

      # v31/out holds packs/ and prepare.json: the artifact's root is that folder.
      - uses: actions/upload-artifact@v4
        with:
          name: v31-packs
          path: v31/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      # The minute cells' dataset: the artifact's root holds binance/.
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'registered' }}
        with:
          name: v31-legacy-data
          path: v31/work/legacy
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  picks:
    needs: prepare
    if: ${{ inputs.mode == 'registered' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      picks_receipt_sha256: ${{ steps.picks.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - uses: actions/download-artifact@v4
        with:
          name: v31-packs
          path: v31/prepared

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          found="$(find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" \
            | grep -E -- '-202[5-9]-|-20[3-9][0-9]-' || true)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      # The step prints the SHA-256 of v3_picks/outcome.json; run-v3 checks the picks it
      # downloads against it.
      - name: V3 selector picks
        id: picks
        run: |
          python scripts/v31_driver.py picks \
            --registration-sha256 "$REGISTRATION_SHA256" \
            --packs v31/prepared/packs \
            --attempt-id ${{ github.run_id }}-attempt-${{ github.run_attempt }} \
            --out v31/picks-out > "$RUNNER_TEMP/picks.json"
          cat "$RUNNER_TEMP/picks.json"
          receipt="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["outcome_sha256"])' "$RUNNER_TEMP/picks.json")"
          printf '%s' "$receipt" | grep -Eq '^[0-9a-f]{64}$'
          echo "receipt_sha256=$receipt" >> "$GITHUB_OUTPUT"

      # v31/picks-out holds v3_picks/: the artifact's root is that folder.
      - uses: actions/upload-artifact@v4
        with:
          name: v3-picks-attempt-${{ github.run_attempt }}
          path: v31/picks-out
          if-no-files-found: error
          retention-days: 90

  run-main:
    needs: [plan, prepare]
    if: ${{ inputs.mode == 'registered' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.main_cells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - uses: actions/download-artifact@v4
        with:
          name: v31-packs
          path: v31/prepared
      # Only the minute cells read this; every cell takes it, which keeps one job definition.
      - uses: actions/download-artifact@v4
        with:
          name: v31-legacy-data
          path: v31/legacy-data

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          found="$(find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" \
            | grep -E -- '-202[5-9]-|-20[3-9][0-9]-' || true)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      - name: Run the cell
        env:
          CELL: ${{ matrix.cell }}
        run: |
          python scripts/v31_driver.py run-cell \
            --registration-sha256 "$REGISTRATION_SHA256" \
            --cell "$CELL" \
            --packs v31/prepared/packs \
            --attempt-id ${{ github.run_id }}-attempt-${{ github.run_attempt }} \
            --legacy-data v31/legacy-data \
            --out v31/cell-out

      # run-cell writes v31/cell-out/<cell_id>/: the artifact's root is v31/cell-out, so a
      # download into its own folder reads cell-<id>-attempt-<n>/<id>/.
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: v31/cell-out
          if-no-files-found: error
          retention-days: 90

  run-v3:
    needs: [plan, prepare, picks]
    if: ${{ inputs.mode == 'registered' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.v3_cells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      - uses: actions/download-artifact@v4
        with:
          name: v31-packs
          path: v31/prepared
      # By pattern, not by this attempt's number: a re-run of failed jobs has a new attempt
      # number, and the picks job (which succeeded) is not re-run.
      - uses: actions/download-artifact@v4
        with:
          pattern: "v3-picks-attempt-*"
          path: v31/picks

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          found="$(find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" \
            | grep -E -- '-202[5-9]-|-20[3-9][0-9]-' || true)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      # Exactly one picks artifact, and it is the one the picks job published.
      - name: Find the picks the picks job published
        id: picks_dir
        env:
          PICKS_RECEIPT_SHA256: ${{ needs.picks.outputs.picks_receipt_sha256 }}
        run: |
          dirs=(v31/picks/v3-picks-attempt-*/v3_picks)
          if [ "${#dirs[@]}" -ne 1 ] || [ ! -d "${dirs[0]}" ]; then
            echo "::error::expected one v3-picks-attempt-<n>/v3_picks directory, found: ${dirs[*]}"
            exit 1
          fi
          actual="$(sha256sum "${dirs[0]}/outcome.json" | cut -d' ' -f1)"
          if [ "$actual" != "$PICKS_RECEIPT_SHA256" ]; then
            echo "::error::${dirs[0]}/outcome.json has SHA-256 $actual, not the picks job's $PICKS_RECEIPT_SHA256."
            exit 1
          fi
          echo "dir=${dirs[0]}" >> "$GITHUB_OUTPUT"

      - name: Run the cell
        env:
          CELL: ${{ matrix.cell }}
          PICKS_DIR: ${{ steps.picks_dir.outputs.dir }}
        run: |
          python scripts/v31_driver.py run-cell \
            --registration-sha256 "$REGISTRATION_SHA256" \
            --cell "$CELL" \
            --packs v31/prepared/packs \
            --attempt-id ${{ github.run_id }}-attempt-${{ github.run_attempt }} \
            --picks "$PICKS_DIR" \
            --out v31/cell-out

      # run-cell writes v31/cell-out/<cell_id>/: the artifact's root is v31/cell-out, so a
      # download into its own folder reads cell-<id>-attempt-<n>/<id>/.
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: v31/cell-out
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [run-main, run-v3, picks]
    # Judge what exists even when cells failed: the verdict names every cell that is missing.
    # !cancelled() alone would also fire in smoke and prepare-only mode (every needed job
    # skipped) and after a failed prepare (nothing to read), so those are excluded.
    if: ${{ !cancelled() && inputs.mode == 'registered' && needs.picks.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # Each artifact in a folder named for it (no merge-multiple), the only layout the
      # aggregation accepts: v31/cells/cell-<id>-attempt-<n>/<id>/ and
      # v31/cells/v3-picks-attempt-<n>/v3_picks/.
      - uses: actions/download-artifact@v4
        with:
          pattern: "cell-*-attempt-*"
          path: v31/cells
      - uses: actions/download-artifact@v4
        with:
          pattern: "v3-picks-attempt-*"
          path: v31/cells

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          found="$(find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" \
            | grep -E -- '-202[5-9]-|-20[3-9][0-9]-' || true)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      - name: Aggregate
        run: |
          python scripts/v31_driver.py aggregate \
            --registration-sha256 "$REGISTRATION_SHA256" \
            --cells v31/cells \
            --out v31/summary-out

      - uses: actions/upload-artifact@v4
        with:
          name: v31-summary
          path: v31/summary-out
          if-no-files-found: error
          retention-days: 90
