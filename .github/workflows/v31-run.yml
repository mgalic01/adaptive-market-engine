          path: v31/summary-out
          if-no-files-found: error
          retention-days: 90

  status:
    needs: [plan, prepare, picks, run-main, run-v3, aggregate]
    # Always, so a run whose aggregate was skipped (a failed prepare, a cancelled run) still
    # leaves a record of what each job did.
    if: ${{ always() && (inputs.mode == 'registered' || inputs.mode == 'rehearsal') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Write the job results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PICKS_RESULT: ${{ needs.picks.result }}
          RUN_MAIN_RESULT: ${{ needs.run-main.result }}
          RUN_V3_RESULT: ${{ needs.run-v3.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          PLANNED_SHA256: ${{ needs.plan.outputs.registration_sha256 }}
          V3_CELLS: ${{ needs.plan.outputs.v3_cells }}
          MAIN_CELLS: ${{ needs.plan.outputs.main_cells }}
          PICKS_RECEIPT_SHA256: ${{ needs.picks.outputs.picks_receipt_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p v31/status
          python - > v31/status/status.json <<'PY'
          import json
          import os


          def cells(name):
              text = os.environ[name]
              return len(json.loads(text)) if text else None


          jobs = ("plan", "prepare", "picks", "run-main", "run-v3", "aggregate")
          status = {
              "schema": "v3.1-status-1",
              "mode": os.environ["MODE"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "jobs": {
                  job: os.environ[job.upper().replace("-", "_") + "_RESULT"] for job in jobs
              },
              "aggregate_ran": os.environ["AGGREGATE_RESULT"] in ("success", "failure"),
              "registration_sha256": os.environ["PLANNED_SHA256"] or None,
              "v3_cells": cells("V3_CELLS"),
              "main_cells": cells("MAIN_CELLS"),
              "picks_receipt_sha256": os.environ["PICKS_RECEIPT_SHA256"] or None,
          }
          print(json.dumps(status, sort_keys=True, separators=(",", ":")))
          PY
          cat v31/status/status.json

      - name: Refuse any file named for 2025 or later
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" > "$RUNNER_TEMP/untracked.txt"
          # grep exits 1 when nothing matches, which is the pass. Any other non-zero status is
          # a broken scan and fails the step, as does a failure of git, find, sort or comm.
          status=0
          grep -E -- '-202[5-9]-|-20[3-9][0-9]-' "$RUNNER_TEMP/untracked.txt" > "$RUNNER_TEMP/found.txt" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::The scan for files named for 2025 or later failed (grep exit $status)."
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/found.txt" ]; then
            cat "$RUNNER_TEMP/found.txt"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.mode == 'rehearsal' && 'v31-rehearsal-status' || 'v31-status' }}-attempt-${{ github.run_attempt }}
          path: v31/status
          if-no-files-found: error
          retention-days: 90

  timing:
    if: ${{ inputs.mode == 'timing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [prepare, picks, cell]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the code commit
        run: |
          if ! printf '%s' "$CODE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::timing mode needs code_commit: 40 lowercase hex."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # Gated like prepare-only. Each part fetches only what it needs into v31/timing-scratch
      # (scanned below, never uploaded) and discards every result it computes; v31/timing
      # gets times, memory and attempt bookkeeping alone, streamed as the part goes.
      - name: Time the part
        id: timing
        timeout-minutes: 335
        env:
          PART: ${{ matrix.part }}
        run: |
          prepare_sha256="$(sha256sum config/v3_1_prepare.json | cut -d' ' -f1)"
          python scripts/v31_driver.py timing \
            --part "$PART" \
            --code-commit "$CODE_COMMIT" \
            --prepare-sha256 "$prepare_sha256" \
            --scratch v31/timing-scratch \
            --out v31/timing > "$RUNNER_TEMP/timing.json"
          cat "$RUNNER_TEMP/timing.json"

      # Also after the part failed or was killed at its step timeout: what it measured so
      # far, the step's outcome and whether it finished.
      - name: Close the timing record
        if: ${{ always() }}
        env:
          PART: ${{ matrix.part }}
          OUTCOME: ${{ steps.timing.outcome }}
        run: |
          python scripts/v31_driver.py timing-close \
            --part "$PART" \
            --step-outcome "$OUTCOME" \
            --step-timeout-minutes 335 \
            --out v31/timing

      - name: Refuse any file named for 2025 or later
        id: guard_outputs
        if: ${{ always() }}
        run: |
          # Archive names end -YYYY-MM. The repository's own files are tracked and are not
          # checked (docs/backtests/fee-levels-2026-09.md is one); what a job fetched,
          # downloaded or made is not tracked, and is.
          git ls-files -z | tr '\0' '\n' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/tracked.txt"
          find . -path ./.git -prune -o -type f -print | LC_ALL=C sort \
            | LC_ALL=C comm -23 - "$RUNNER_TEMP/tracked.txt" > "$RUNNER_TEMP/untracked.txt"
          # grep exits 1 when nothing matches, which is the pass. Any other non-zero status is
          # a broken scan and fails the step, as does a failure of git, find, sort or comm.
          status=0
          grep -E -- '-202[5-9]-|-20[3-9][0-9]-' "$RUNNER_TEMP/untracked.txt" > "$RUNNER_TEMP/found.txt" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::The scan for files named for 2025 or later failed (grep exit $status)."
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/found.txt" ]; then
            cat "$RUNNER_TEMP/found.txt"
            echo "::error::Files named for 2025 or later exist; the reserved window is never fetched."
            exit 1
          fi

      # Only v31/timing: elapsed times, peak memory and the picks' attempt bookkeeping.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.guard_outputs.outcome == 'success' }}
        with:
          name: v31-timing-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: v31/timing
          if-no-files-found: warn
          retention-days: 90
