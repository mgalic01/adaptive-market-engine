name: v4-run
# Each run's title names its mode and registration: a registered dispatch is
# "v4-run registered <registration_sha256>", which the dispatch check looks for.
run-name: v4-run ${{ inputs.mode }} ${{ inputs.registration_sha256 }}

# V4.0's run on GitHub's machines, so that no heavy work runs on the owner's PC (owner rule
# 2026-10-19): the 48 cells of the registration (scripts/v4_registration.py, Ruling G1), each one
# job. It never trades, holds no stored credentials, can only read the repository and commits
# nothing: its results are artifacts. Three steps of the plan job get the job's own token, with
# read access to this repository's workflow runs and artifacts and nothing more: the dispatch
# check, and the data run's check and download. Besides checkout, pip installs and artifact
# transfers, the only network request is the registered run's v3-pack job, which reads V3's
# pinned archives from Binance's public archive (data.binance.vision, scripts/v4_v3_pack.py).
#
# A dispatch picks one of three modes:
#
# - rehearsal (the default): the registered job graph on a synthetic world that the plan job
#   builds (scripts/v4_rehearsal.py world, Ruling W3): a data pack, a V3 pack, and a git
#   repository whose code pin commits the rehearsal marker (config/v4_rehearsal.json) with a
#   registration on top, so the real job gate runs on it, in the plan job and in every cell job.
#   The dispatch check runs report-only, on the rehearsal's own title. Its V3 picks are the
#   rehearsal's stand-in (scripts/v4_rehearsal.py picks); every other job is the registered
#   run's. It fetches no market data, and its outputs carry rehearsal names, so a synthetic pass
#   can never pass for the registered run's. It needs no input: registration_sha256 and
#   data_run stay empty.
# - timing: the 44 cells that are not v3 on the real-size synthetic world (Ruling W2): no
#   registration exists yet, so nothing is gated or checked for a second dispatch. Only its
#   v4-timing-* artifacts are downloaded after it; the cells' own artifacts simply expire. The v3
#   cells' times come from the v4-v3 run 40040422092.
# - registered: the registered experiment, once (spec, "Registration and the run"). The plan job
#   gates the checkout on the dispatched registration_sha256 first of all, refuses a second
#   dispatch of the registration, checks the data run (data_run) through GitHub's API before
#   anything of it is downloaded, then guards the downloaded data against the run manifest's
#   pins; v3-pack rebuilds V3's input pack; v3-picks trains V3's selector once; every cell job
#   guards its data and gates its checkout again before its cell runs.
#
# OPERATING RULE: one v4-run at a time. Never dispatch v4-run while another v4-run is queued or
# running: the concurrency group below keeps the running one, but GitHub keeps one pending run
# per group and cancels it when a newer one arrives, so a queued registered run could be dropped.
# Never cancel a queued or running registered dispatch, and never re-run one: a cancelled launch
# counts as an execution of its registration (owner decision v31-d21, layer L2), and a re-run
# voids the verdict.
#
# THE DISPATCH REF: a registered or timing run is dispatched from the registration's ref. The
# registered run's ref is the code pin plus the registration files only (config/v4_registration.json,
# config/v4_run_manifest.json, docs/trials/register.jsonl, docs/reviews/** and docs/tasks/**,
# Ruling G2), which the job gate checks in the plan job and again in every cell job, so a wrong
# ref fails in the first job; every checkout holds the full history, which that check reads. A
# timing run, made before the registration exists, is dispatched from the code pin's ref, so its
# times are the registered code's. The registered data run (data_run) must be a successful
# "v4-data full config/v4_data.json" run of this run's own commit (github.sha), so dispatch it
# from the same ref, and this run within a day of it: its v4-data artifact is kept one day.
#
# THE MATRICES: scripts/v4_run_plan.py matrix lists the cells of the mode, the verdict's expected
# cells (so a cell that runs is a cell that is expected): the cell job takes the 44 that are not
# v3 (fail-fast off, at most 20 at a time), and the v3-cell job the 4 v3_as_built cells. A timing
# run has no v3 cell, and the v3-cell job is skipped then, since GitHub refuses an empty matrix.
# GitHub runs at most 256 jobs from one matrix.
#
# Artifacts (Ruling W1), every one kept one day (owner decision v4-d10: the results stay on the
# owner's PC; after a run, download them to E:, check them against GitHub's digests, then offer
# their deletion):
# - v4-data: the checked data pack (the data run's in a registered run, the world's otherwise);
# - v4-v3-pack: V3's input pack (the v3-pack job's in a registered run, the world's in a
#   rehearsal);
# - v4-rehearsal-world: world.tar (the world's git repository, under repo/) and rehearsal.json;
# - v4-v3-picks-attempt-<n>: v3_picks.json;
# - v4-cell-<cell>-attempt-<n>: a cell's whole folder (records.jsonl, receipt.json, summary.json,
#   report.html, timing.json), which the analysis reads;
# - v4-summary-<cell>-attempt-<n>: the cell's summary.json and receipt.json alone, which the
#   verdict reads (about 3 MB a cell, so the verdict step stays far inside its disk);
# - v4-v3-cell-<cell>-attempt-<n>: a v3 cell's folder (never v4-cell-*, which the analysis reads);
# - v4-timing-cell-<cell>-attempt-<n>: a timing run's cell timing.json alone.
# Every name carries -attempt-<n> (github.run_attempt) but v4-data, v4-v3-pack and
# v4-rehearsal-world, whose names are fixed and which are uploaded without overwrite, so a
# re-run of the whole workflow fails closed at the plan job. A cell's uploads run after its
# replay succeeded, a failed timing step included (the job still fails); a failed replay
# uploads nothing.
#
# A registered run is executed once. Re-running any job, the failed ones or all of them, is a new
# recorded attempt (a new run_attempt), whose artifacts carry its number: the verdict refuses a
# cell from an attempt other than 1 (a re-run), and a re-run voids the verdict, by design. A v3
# cell re-run without the picks job fails at its download: it takes the picks of its own attempt.
# Do not re-run a registered run.
#
# The reserved window (owner decision v4-d03): no market data from 2025-01 onward is executed
# before the registered run. The rehearsal and timing modes run on synthetic worlds only, and the
# data guard (scripts/v4_run_guard.py --synthetic) refuses any other data in the plan job and in
# every cell job before its cell. The registered run opens only the registered data: its data
# run is checked through GitHub's API before anything is downloaded, and the guard holds the
# downloaded data.json's pins to the run manifest's (--manifest), which the job gate, run before
# it, holds to the registration.
#
# The logs are public: each script prints counts, ids, sizes, times and pins only, never a price,
# an equity, a return, a cell's outcome or the verdict, and every cell CLI's standard output (its
# outcome) goes to /dev/null.
#
# Jobs:
# - plan (every mode): records its start (the dispatch check's budget), lists the cells' matrices,
#   then in a registered run gates this checkout, refuses a second dispatch, checks the data run,
#   downloads its v4-data artifact and guards it; in a rehearsal builds the world, gates the
#   world's repository, runs the dispatch check report-only and guards the world's data; in a
#   timing run builds the real-size world and guards its data. It uploads the checked data as
#   v4-data (and, in a rehearsal, v4-v3-pack and v4-rehearsal-world). Its outputs are the
#   matrices, the cells' ids, the v3 cell count, and the gate's V3 pack pin and registration.
# - v3-pack (registered): scripts/v4_v3_pack.py fetches V3's pinned archives and builds V3's input
#   pack, which must be both V3.1's registered pin (V3_PACK_SHA256) and the run manifest's (the
#   plan's v3_pack_sha256); then v4-v3-pack.
# - v3-picks (registered, rehearsal): trains V3's selector once on that pack
#   (scripts/v4_v3_cell.py picks; a rehearsal's stand-in, scripts/v4_rehearsal.py picks); its
#   output picks_sha256 is the SHA-256 of the file it wrote, the pin every v3 cell requires.
# - cell, one job per cell of the plan's cells matrix: downloads v4-data, guards it, gates the
#   checkout again (a rehearsal's world repository), then runs scripts/v4_cell.py under GNU time
#   (/usr/bin/time -v) and keeps its wall time and peak memory in timing.json
#   (scripts/v4_cells_timing.py).
# - v3-cell, one job per v3 cell (registered, rehearsal): downloads the pack and the picks, checks
#   both files against their pins (the plan's and the picks job's) before anything runs, gates the
#   checkout again, then runs scripts/v4_v3_cell.py run under GNU time.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearsal (the registered job graph on a synthetic world), timing (the 44 cells on the real-size synthetic world) or registered (the registered experiment, once)"
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - timing
          - registered
      registration_sha256:
        description: "registered: SHA-256 of config/v4_registration.json, 64 lowercase hex (empty otherwise)"
        required: false
        default: ""
        type: string
      data_run:
        description: "registered: the id of the v4-data full run (config/v4_data.json) of this commit, finished less than 24 hours ago (empty otherwise)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One v4-run at a time: cancel-in-progress: false keeps the running one. GitHub keeps one pending
# run per group and cancels it when a newer one arrives, hence the operating rule in the header.
concurrency:
  group: v4-run
  cancel-in-progress: false

# The dispatch's inputs reach scripts through the environment, never spliced into them.
# V3_PACK_SHA256 is V3.1's registered V3 pack pin (v3_pack_sha256 of config/v3_1_run_manifest.json
# and EXPECTED_PACK_SHA256 of scripts/v4_v3_pack.py), the constant of v4-v3.yml.
env:
  MODE: ${{ inputs.mode }}
  REGISTRATION_SHA256: ${{ inputs.registration_sha256 }}
  DATA_RUN: ${{ inputs.data_run }}
  V3_PACK_SHA256: 8a4780009bfe580995396b60fd30e52bbc21888a470e49eedb84910087a55dee

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions: read lets the dispatch check list this workflow's runs and jobs, and the data-run
    # steps read the data run and download its artifact; nothing is written.
    permissions:
      contents: read
      actions: read
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
      v3_cells: ${{ steps.matrix.outputs.v3_cells }}
      cell_ids: ${{ steps.matrix.outputs.cell_ids }}
      v3_count: ${{ steps.matrix.outputs.v3_count }}
      v3_pack_sha256: ${{ steps.gate.outputs.v3_pack_sha256 }}
      registration_sha256: ${{ steps.gate.outputs.registration_sha256 }}
    steps:
      # First of all: the job's start, from which the dispatch check budgets its deadline
      # (PLAN_JOB_BUDGET, 25 of the job's 60 minutes), whatever the checkout and installs take.
      - name: Record the job's start
        run: echo "V4_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # The mode's cells (no data is read): the 44 that are not v3 and the v3 cells (none in a
      # timing run), their ids and counts. A mode that is not one of the three is refused.
      - id: matrix
        name: List the cells of the mode
        run: python scripts/v4_run_plan.py matrix --mode "$MODE" --github-output "$GITHUB_OUTPUT"

      # A rehearsal's or timing run's world, synthetic (its scale is the mode; the script refuses
      # any other): world/v4data, and for a rehearsal world/v3pack, world/world.tar and
      # world/rehearsal.json, whose registration_sha256 is the world's registration's pin.
      - name: Build the synthetic world
        if: ${{ inputs.mode == 'rehearsal' || inputs.mode == 'timing' }}
        run: python scripts/v4_rehearsal.py world --scale "$MODE" --out world

      - id: world
        name: Unpack the rehearsal world's repository and keep its registration's pin
        if: ${{ inputs.mode == 'rehearsal' }}
        run: |
          tar -xf world/world.tar -C world
          sha="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="ascii"))["registration_sha256"] or "")' world/rehearsal.json)"
          if [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::world/rehearsal.json names no registration SHA-256." >&2
            exit 1
          fi
          echo "registration_sha256=$sha" >> "$GITHUB_OUTPUT"

      # The job gate, before any guard and any download (Rulings G2, G3): the registration file
      # hashes to the pin, the run manifest to the registration's, nothing changed since the code
      # pin but the registration files, and the V4 trial authorizes the registration. In a
      # registered run on this checkout, with the dispatched pin; in a rehearsal on the world's
      # repository, with the world's. Its outputs (--github-output) are the code pin, the V3
      # pack pin and the run manifest's data pins; then, once it accepted, the registration.
      - id: gate
        name: Gate the run on its registration
        if: ${{ inputs.mode == 'registered' || inputs.mode == 'rehearsal' }}
        env:
          WORLD_REGISTRATION_SHA256: ${{ steps.world.outputs.registration_sha256 }}
        run: |
          if [ "$MODE" = registered ]; then
            python scripts/v4_registration.py gate --repo . --mode registered --registration-sha256 "$REGISTRATION_SHA256" --github-output "$GITHUB_OUTPUT"
            echo "registration_sha256=$REGISTRATION_SHA256" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = rehearsal ]; then
            python scripts/v4_registration.py gate --repo world/repo --mode rehearsal --registration-sha256 "$WORLD_REGISTRATION_SHA256" --github-output "$GITHUB_OUTPUT"
            echo "registration_sha256=$WORLD_REGISTRATION_SHA256" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the job gate runs in registered and rehearsal mode only, not $MODE." >&2
            exit 1
          fi

      # A registration is dispatched once (Ruling G4): this workflow's runs, listed through
      # GitHub's API, must hold no other registered dispatch of it created before or with this
      # run, unless GitHub's records show that launch stopped at this job with nothing run. A
      # rehearsal runs the same check report-only, on its own title (the dispatch's input): it
      # logs what a registered check would decide, fails only when GitHub cannot be read, and
      # reads its own run's job listing too.
      - name: Refuse a second dispatch of the registration
        if: ${{ inputs.mode == 'registered' || inputs.mode == 'rehearsal' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = registered ]; then
            python scripts/v4_registration.py dispatch-check --mode registered --registration-sha256 "$REGISTRATION_SHA256"
          elif [ "$MODE" = rehearsal ]; then
            python scripts/v4_registration.py dispatch-check --mode rehearsal --report-only --registration-sha256 "$REGISTRATION_SHA256"
          else
            echo "::error::the dispatch check runs in registered and rehearsal mode only, not $MODE." >&2
            exit 1
          fi

      # Before anything is downloaded (Ruling G5): the data run's id is digits, and the run is a
      # successful "v4-data full config/v4_data.json" run of the v4-data workflow made from this
      # run's own commit (github.sha: the same data code and the same ref, which the gate holds
      # to the code pin). The API's answer goes straight to the check, never to the log; the
      # check prints the run's id and its verdict only. The validated id is the step's output.
      - id: data_run
        name: Refuse a data run that is not the full data run of this commit
        if: ${{ inputs.mode == 'registered' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          if [[ ! "$DATA_RUN" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::a registered run needs data_run: the id of the v4-data run, digits only." >&2
            exit 1
          fi
          gh api "repos/$REPOSITORY/actions/runs/$DATA_RUN" | python scripts/v4_run_guard.py --data-run "$DATA_RUN" --commit "$COMMIT"
          echo "data_run=$DATA_RUN" >> "$GITHUB_OUTPUT"

      - if: ${{ inputs.mode == 'registered' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-data
          run-id: ${{ steps.data_run.outputs.data_run }}
          github-token: ${{ github.token }}
          path: v4data

      # The data the run opens, in every mode: in a registered run, the data run's pack, whose
      # data.json pins must be the run manifest's (and the manifest's config file must hash to
      # its config_sha256); otherwise the world's, which must be synthetic (v4-d03).
      - name: Refuse data that is not the run's
        run: |
          if [ "$MODE" = registered ]; then
            python scripts/v4_run_guard.py --data v4data --manifest config/v4_run_manifest.json
          elif [ "$MODE" = rehearsal ] || [ "$MODE" = timing ]; then
            python scripts/v4_run_guard.py --data world/v4data --synthetic
          else
            echo "::error::the data guard knows the registered, rehearsal and timing modes only, not $MODE." >&2
            exit 1
          fi

      # The checked data, as this run's own artifact, which every cell job downloads: so the data
      # run's artifact may expire while the cells run. The name is fixed and nothing is
      # overwritten, so a re-run of the whole workflow fails here (Ruling W1).
      - if: ${{ inputs.mode == 'registered' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-data
          path: v4data/
          if-no-files-found: error
          retention-days: 1
      - if: ${{ inputs.mode == 'rehearsal' || inputs.mode == 'timing' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-data
          path: world/v4data/
          if-no-files-found: error
          retention-days: 1

      # A rehearsal's V3 pack (the v3-pack job's place in a registered run) and its world: the
      # repository the cell jobs gate again, and rehearsal.json, which the picks read.
      - if: ${{ inputs.mode == 'rehearsal' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-v3-pack
          path: world/v3pack/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - if: ${{ inputs.mode == 'rehearsal' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-rehearsal-world
          path: |
            world/world.tar
            world/rehearsal.json
          if-no-files-found: error
          retention-days: 1

  v3-pack:
    needs: plan
    # A registered run only (a rehearsal's plan built the world's pack). No status function, so a
    # failed plan skips it.
    if: ${{ inputs.mode == 'registered' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The run manifest's V3 pack pin, which the plan's gate read.
    env:
      PACK_SHA256: ${{ needs.plan.outputs.v3_pack_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # The script exits 0 only if the pack's pin is V3.1's (ruling R4 of step 4a).
      - name: Fetch V3's archives and build its input pack
        run: python scripts/v4_v3_pack.py --work work --out out

      # And the run manifest's: the registration names the pack the v3 cells read.
      - name: Check the pack against V3.1's pin and the run manifest's
        run: |
          digest=$(sha256sum out/v3-input.pack.json.gz | cut -d' ' -f1)
          if [ "$digest" != "$V3_PACK_SHA256" ] || [ "$digest" != "$PACK_SHA256" ]; then
            echo "::error::the V3 pack is not both V3.1's registered pack and the run manifest's." >&2
            exit 1
          fi

      # out/ holds the pack alone; the archives stay in work/. A refused pack uploads nothing.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-v3-pack
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  v3-picks:
    needs: [plan, v3-pack]
    # A registered run (after the v3-pack job) and a rehearsal (whose v3-pack job is skipped:
    # the plan built the pack). GitHub skips the dependents of a skipped job unless a status
    # function says otherwise, hence !cancelled() and the result each mode requires.
    if: ${{ !cancelled() && needs.plan.result == 'success' && ((inputs.mode == 'registered' && needs.v3-pack.result == 'success') || (inputs.mode == 'rehearsal' && needs.v3-pack.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PACK_SHA256: ${{ needs.plan.outputs.v3_pack_sha256 }}
    outputs:
      picks_sha256: ${{ steps.pin.outputs.picks_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # This run's pack: v3pack/v3-input.pack.json.gz; a rehearsal's under its world folder,
      # beside rehearsal.json, as the rehearsal's picks read it.
      - if: ${{ inputs.mode == 'registered' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-v3-pack
          path: v3pack
      - if: ${{ inputs.mode == 'rehearsal' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-rehearsal-world
          path: world
      - if: ${{ inputs.mode == 'rehearsal' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-v3-pack
          path: world/v3pack

      # The script reads the pack through its pin and refuses an existing picks file. A failed
      # step skips every step after it, the upload included.
      - name: Train V3's selector once on the pack
        if: ${{ inputs.mode == 'registered' }}
        run: python scripts/v4_v3_cell.py picks --pack v3pack/v3-input.pack.json.gz --pack-sha256 "$PACK_SHA256" --out picks

      # V3's selector trains over four years, far too long for a rehearsal: its stand-in, on the
      # world's pack (which must be the pin rehearsal.json names, never V3.1's).
      - name: Write the rehearsal's stand-in picks
        if: ${{ inputs.mode == 'rehearsal' }}
        run: python scripts/v4_rehearsal.py picks --world world --out picks

      # The picks' pin is the digest of the file just written, never a value from outside.
      - id: pin
        name: Keep the picks file's SHA-256 as the job's output
        run: |
          digest=$(sha256sum picks/v3_picks.json | cut -d' ' -f1)
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the picks file's SHA-256 could not be read." >&2
            exit 1
          fi
          echo "picks_sha256=$digest" >> "$GITHUB_OUTPUT"

      # picks/ holds the picks file alone.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-v3-picks-attempt-${{ github.run_attempt }}
          path: picks/
          if-no-files-found: error
          retention-days: 1

  cell:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    # The registration the plan gated: the dispatched one in a registered run, the world's in a
    # rehearsal (none in a timing run, which is not gated).
    env:
      CELL: ${{ matrix.cell }}
      ARM: ${{ matrix.arm }}
      CAPITAL: ${{ matrix.capital }}
      COSTS: ${{ matrix.costs }}
      RUN_REGISTRATION_SHA256: ${{ needs.plan.outputs.registration_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # This run's own copy of the data, which the plan checked and uploaded.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-data
          path: v4data

      # Again, in this job: the cell never starts on data that is not the run's.
      - name: Refuse data that is not the run's
        run: |
          if [ "$MODE" = registered ]; then
            python scripts/v4_run_guard.py --data v4data --manifest config/v4_run_manifest.json
          elif [ "$MODE" = rehearsal ] || [ "$MODE" = timing ]; then
            python scripts/v4_run_guard.py --data v4data --synthetic
          else
            echo "::error::the data guard knows the registered, rehearsal and timing modes only, not $MODE." >&2
            exit 1
          fi

      # A rehearsal gates the world's repository, which the plan uploaded as world.tar.
      - if: ${{ inputs.mode == 'rehearsal' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-rehearsal-world
          path: world
      - name: Unpack the rehearsal world's repository
        if: ${{ inputs.mode == 'rehearsal' }}
        run: tar -xf world/world.tar -C world

      # The job gate again, before the cell: this checkout in a registered run, the world's
      # repository in a rehearsal.
      - name: Gate the cell on the registration
        if: ${{ inputs.mode == 'registered' || inputs.mode == 'rehearsal' }}
        run: |
          if [ "$MODE" = registered ]; then
            python scripts/v4_registration.py gate --repo . --mode registered --registration-sha256 "$RUN_REGISTRATION_SHA256"
          elif [ "$MODE" = rehearsal ]; then
            python scripts/v4_registration.py gate --repo world/repo --mode rehearsal --registration-sha256 "$RUN_REGISTRATION_SHA256"
          else
            echo "::error::the job gate runs in registered and rehearsal mode only, not $MODE." >&2
            exit 1
          fi

      - name: Check that GNU time is installed
        run: |
          if [ ! -x /usr/bin/time ]; then
            echo "::error::/usr/bin/time (GNU time) is missing, so the cell's peak memory cannot be measured." >&2
            exit 1
          fi

      # The cell writes out/<cell id>/ (records.jsonl, receipt.json, summary.json, report.html);
      # time writes out/<cell id>.time beside that folder. The cell's standard output, one line
      # with its outcome, goes to /dev/null: an outcome is a result, and the log is public. A
      # failure is still one line on standard error, the exception's type only.
      - name: Replay the cell
        run: |
          mkdir -p out
          /usr/bin/time -v -o "out/$CELL.time" \
            python scripts/v4_cell.py run --data v4data --arm "$ARM" --capital "$CAPITAL" --costs "$COSTS" --out out > /dev/null

      - id: timing
        name: Keep the cell's wall time and peak memory
        run: python scripts/v4_cells_timing.py --time-file "out/$CELL.time" --cell-dir "out/$CELL"

      # A timing step that failed must not discard a replay that succeeded (the job still fails):
      # the uploads run after a failed timing step, and after nothing else that failed, so a
      # failed replay uploads nothing. The cell's folder (the analysis reads it), its summary
      # and receipt alone (the verdict reads those), and in a timing run its timing alone.
      - if: ${{ success() || steps.timing.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-cell-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: out/${{ matrix.cell }}/
          if-no-files-found: error
          retention-days: 1
      - if: ${{ success() || steps.timing.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-summary-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: |
            out/${{ matrix.cell }}/summary.json
            out/${{ matrix.cell }}/receipt.json
          if-no-files-found: error
          retention-days: 1
      - if: ${{ (success() || steps.timing.outcome == 'failure') && inputs.mode == 'timing' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-timing-cell-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: out/${{ matrix.cell }}/timing.json
          if-no-files-found: error
          retention-days: 1

  v3-cell:
    needs: [plan, v3-pack, v3-picks]
    # A registered run and a rehearsal, after the picks; never on an empty matrix (a timing run
    # has no v3 cell, and GitHub refuses one). The v3-pack job is skipped in a rehearsal, hence
    # !cancelled() and the result each mode requires, as in v3-picks.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.v3-picks.result == 'success' && needs.plan.outputs.v3_count != '0' && ((inputs.mode == 'registered' && needs.v3-pack.result == 'success') || (inputs.mode == 'rehearsal' && needs.v3-pack.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.v3_cells) }}
    # The pack's pin is the plan's (the run manifest's, which the gate read; the world's in a
    # rehearsal) and the picks' the picks job's: the picks file does not name its pack, so the
    # workflow pairs them.
    env:
      CELL: ${{ matrix.cell }}
      CAPITAL: ${{ matrix.capital }}
      COSTS: ${{ matrix.costs }}
      PACK_SHA256: ${{ needs.plan.outputs.v3_pack_sha256 }}
      PICKS_SHA256: ${{ needs.v3-picks.outputs.picks_sha256 }}
      RUN_REGISTRATION_SHA256: ${{ needs.plan.outputs.registration_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps

      # This run's pack and picks: v3pack/v3-input.pack.json.gz and picks/v3_picks.json.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-v3-pack
          path: v3pack
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-v3-picks-attempt-${{ github.run_attempt }}
          path: picks

      # Before anything runs: each file must be the one its pin names. The script checks both
      # pins again when it reads the files.
      - name: Check the pack and the picks against their pins
        run: |
          pack=$(sha256sum v3pack/v3-input.pack.json.gz | cut -d' ' -f1)
          if [ "$pack" != "$PACK_SHA256" ]; then
            echo "::error::the downloaded V3 pack is not the one the plan pinned." >&2
            exit 1
          fi
          picks=$(sha256sum picks/v3_picks.json | cut -d' ' -f1)
          if [ "$picks" != "$PICKS_SHA256" ]; then
            echo "::error::the downloaded picks file is not the one the picks job pinned." >&2
            exit 1
          fi

      - if: ${{ inputs.mode == 'rehearsal' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v4-rehearsal-world
          path: world
      - name: Unpack the rehearsal world's repository
        if: ${{ inputs.mode == 'rehearsal' }}
        run: tar -xf world/world.tar -C world

      # The job gate again, before the cell, as in the cell job.
      - name: Gate the cell on the registration
        if: ${{ inputs.mode == 'registered' || inputs.mode == 'rehearsal' }}
        run: |
          if [ "$MODE" = registered ]; then
            python scripts/v4_registration.py gate --repo . --mode registered --registration-sha256 "$RUN_REGISTRATION_SHA256"
          elif [ "$MODE" = rehearsal ]; then
            python scripts/v4_registration.py gate --repo world/repo --mode rehearsal --registration-sha256 "$RUN_REGISTRATION_SHA256"
          else
            echo "::error::the job gate runs in registered and rehearsal mode only, not $MODE." >&2
            exit 1
          fi

      - name: Check that GNU time is installed
        run: |
          if [ ! -x /usr/bin/time ]; then
            echo "::error::/usr/bin/time (GNU time) is missing, so the cell's peak memory cannot be measured." >&2
            exit 1
          fi

      # As in the cell job: the cell's standard output, its outcome, goes to /dev/null.
      - name: Replay the cell
        run: |
          mkdir -p out
          /usr/bin/time -v -o "out/$CELL.time" \
            python scripts/v4_v3_cell.py run --pack v3pack/v3-input.pack.json.gz --pack-sha256 "$PACK_SHA256" --picks picks/v3_picks.json --picks-sha256 "$PICKS_SHA256" --capital "$CAPITAL" --costs "$COSTS" --out out > /dev/null

      - id: timing
        name: Keep the cell's wall time and peak memory
        run: python scripts/v4_cells_timing.py --time-file "out/$CELL.time" --cell-dir "out/$CELL"

      # As in the cell job; a v3 cell's folder is v4-v3-cell-*, never v4-cell-*, which the
      # analysis reads. Its summary is v4-summary-*, which the verdict reads.
      - if: ${{ success() || steps.timing.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-v3-cell-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: out/${{ matrix.cell }}/
          if-no-files-found: error
          retention-days: 1
      - if: ${{ success() || steps.timing.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-summary-${{ matrix.cell }}-attempt-${{ github.run_attempt }}
          path: |
            out/${{ matrix.cell }}/summary.json
            out/${{ matrix.cell }}/receipt.json
          if-no-files-found: error
          retention-days: 1
