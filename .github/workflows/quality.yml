name: quality

on:
  push:
    branches-ignore:
      - automation/codex-worker-state
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit and its first parent (the base), for the Bob branch scope check.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      # mypy covers src and scripts; tests/ is intentionally excluded — the test helpers
      # use runtime-only patterns (dataclass replace, mock.patch) that mypy cannot resolve
      # without stub packages not included in requirements-dev.lock.
      - run: mypy src scripts
      - run: pytest
      - run: python scripts/check_reports.py
      # Validate all dataset spec files parse cleanly — catches typos and missing required
      # fields without requiring fetched data.
      - name: Validate dataset specs
        run: |
          python -c "
          from pathlib import Path
          from crypto_grid_bot.backtest.dataset import load_spec
          for p in sorted(Path('config/datasets').glob('*.toml')):
              load_spec(p)
              print(f'OK: {p.name}')
          "
      - name: Bob task branch scope
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'bob/task-')
        run: |
          git diff --name-status HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          git show HEAD^1:docs/reviews/README.md > "$RUNNER_TEMP/base-index.md"
          python scripts/check_reports.py --changed "$RUNNER_TEMP/changed.txt" --base-index "$RUNNER_TEMP/base-index.md"
      - run: python -m crypto_grid_bot.app --config config/default.toml --self-check
      - run: python -m crypto_grid_bot.app --config config/default.toml --paper-demo --database /tmp/grid-paper-ci.db
      - run: bandit -q -r src scripts
      - run: pip-audit
