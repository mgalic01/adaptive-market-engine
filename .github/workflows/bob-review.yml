name: IBM Bob review

# Owner instruction (2026-09-25): Bob runs only when explicitly asked. The job triggers
# on a PR comment containing "@bob" (case-insensitive) from the owner or a collaborator.
# It never runs on pushes, reviews or comments that merely mention Bob. Its own comments
# are posted with GITHUB_TOKEN, which does not trigger new workflow runs.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bob-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bob-review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@bob') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash

      - name: IBM Bob review
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          bob --auth-method api-key --accept-license -p "
          You are IBM Bob on the crypto-grid-bot project.
          Repo: $REPO  PR: #$PR_NUMBER  Requested by: $COMMENTER (explicit @bob mention)

          Your role (docs/AGENT_HANDOFF.md, Three agents): independent strategy and data
          review here; runs, checks and monitoring happen only in the owner's session from
          reviewed task files. In this workflow you only read and comment. You do NOT merge,
          approve, push, change code, config, specs, manifests or results, or touch the
          reserved evaluation window.

          Steps:
          1. Read the PR: gh pr view $PR_NUMBER --repo $REPO
          2. Read the recent comments, including the one that mentioned you:
             gh pr view $PR_NUMBER --repo $REPO --comments | tail -150
          3. Check docs/reviews/README.md for owner decisions that conflict with this PR.
          4. Post ONE comment: gh pr comment $PR_NUMBER --repo $REPO --body '...'
             Start with 'IBM Bob'. Answer what you were asked. State NOTED (no issues) or
             FLAGGED (concerns found, each with the file/section it affects).
             Keep it under 25 lines. Do not write the at-sign mention of your own name.
             End with: '— IBM Bob (automated review)'
          " 2>&1
