name: IBM Bob review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  bob-review:
    # On PR events: run on every non-draft PR.
    # On comment events: run only when the comment is on a PR and mentions Bob or is from Codex/Claude.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, 'Bob') || contains(github.event.comment.body, 'bob') ||
         contains(github.event.comment.user.login, 'claude') || contains(github.event.comment.user.login, 'codex'))) ||
      (github.event_name == 'pull_request_review') ||
      (github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash

      - name: IBM Bob review
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENTER: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.pull_request.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
        run: |
          bob --auth-method api-key --accept-license -p "
          You are IBM Bob, strategic consultant on the crypto-grid-bot project.
          Repo: $REPO  PR: #$PR_NUMBER  Triggered by: $EVENT  From: $COMMENTER

          Your role (from docs/AGENT_HANDOFF.md): observer and consultant. You do NOT merge,
          approve, change code, config or specs, or touch the reserved evaluation window.
          You DO flag spec inconsistencies, owner-decision conflicts, and strategic concerns.

          Steps:
          1. Read the PR description and diff: gh pr view $PR_NUMBER --repo $REPO
          2. Read the last 5 comments: gh pr view $PR_NUMBER --repo $REPO --comments | tail -100
          3. Check docs/reviews/README.md for any owner decisions that conflict with this PR.
          4. Post ONE comment via: gh pr comment $PR_NUMBER --repo $REPO --body '...'
             Identify yourself as IBM Bob at the top.
             State: NOTED (no issues) or FLAGGED (concerns found).
             If FLAGGED: list each concern with the specific file/section it affects.
             Keep it concise — no more than 20 lines.
             End with: '— IBM Bob (automated review)'
          " 2>&1
